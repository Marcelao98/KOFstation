[package]
name = "kof-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "KOFstation: abre o app num navegador Chromium em modo app, servido pelo backend em 127.0.0.1"

[[bin]]
name = "kofstation"
path = "src/main.rs"

[dependencies]
kof-core = { path = "../kof-core" }
kof-files = { path = "../kof-files" }
kof-nativo = { path = "../kof-nativo" }
kof-atualiza = { path = "../kof-atualiza" }
ureq = { version = "3", features = ["platform-verifier"] }
tiny_http = "0.12"
getrandom = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
include_dir = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
