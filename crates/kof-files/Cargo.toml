[package]
name = "kof-files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Arquivos do KOFstation: escopos, pasta Kof Games, varredura, organizar, saves e configurações"

[lints]
workspace = true

[dependencies]
kof-core = { path = "../kof-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
crc32fast = "1"
ureq = { version = "3", features = ["platform-verifier"] }

[dev-dependencies]
tempfile = "3"
