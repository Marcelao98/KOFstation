[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# o tiny_http 0.12.0 com a correção da fila de linhas (conexão que ficava sem resposta); ver third_party/tiny_http/LEIA-ME.md
[patch.crates-io]
tiny_http = { path = "third_party/tiny_http" }
