# Compila os núcleos nativos (tools/nucleos-nativos.sh) e publica como anexos da Release `nucleos-nativos-<commit>`.
# O manifesto (third_party/cores/manifest.json, seção "nativos") guarda o SHA-256 de cada anexo; o `pnpm nucleos` baixa
# e confere. Roda quando o script ou este arquivo mudam (ou à mão). Nada disso entra no histórico do git.
name: Núcleos nativos
on:
  push:
    paths:
      - tools/nucleos-nativos.sh
      - .github/workflows/nucleos-nativos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compilar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compiladores (gcc e mingw-w64)
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
      - name: Compilar
        run: sh tools/nucleos-nativos.sh
      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(sed -n 's/^PCSX_COMMIT=//p' tools/nucleos-nativos.sh | cut -c1-7)
          tag="nucleos-nativos-$commit"
          mkdir -p saida
          cp third_party/cores/nativos/linux-x64/pcsx_rearmed_libretro.so saida/pcsx_rearmed_libretro-linux-x64.so
          cp third_party/cores/nativos/windows-x64/pcsx_rearmed_libretro.dll saida/pcsx_rearmed_libretro-windows-x64.dll
          (cd saida && sha256sum * > SHA256SUMS && cat SHA256SUMS && ls -l)
          # publicado uma vez só por commit: o manifesto fixa o SHA-256 destes arquivos (recompilar daria outros bytes)
          if gh release view "$tag" >/dev/null 2>&1; then echo "a Release $tag já existe: nada a fazer"; exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Núcleos nativos ($commit)" \
              --notes "PCSX-ReARMed $commit (GPL-2.0, github.com/libretro/pcsx_rearmed) compilado por tools/nucleos-nativos.sh. Baixado e conferido pelo pnpm nucleos (SHA-256 no manifesto)."
          gh release upload "$tag" saida/*
