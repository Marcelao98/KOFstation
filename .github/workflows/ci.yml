name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Cabeçalhos do som (ALSA, pro cpal do kof-nativo) e genisoimage (CD grande no teste do PS1)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev genisoimage libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Rust (versão do rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Núcleos (do kofstation-old, conferidos por SHA-256)
        run: pnpm nucleos
      - name: TypeScript (formato, lint, tipos, testes)
        run: pnpm check
      - name: Rust (formato, clippy, testes)
        # no Windows o teste do Dolphin com OpenGL trava desde o W.1 (sem placa de vídeo no CI): 30 min e corta
        timeout-minutes: 30
        run: pnpm check:rust
        env:
          # no Linux o OpenGL sem janela (Mesa) tem que existir: o teste do núcleo que desenha na placa não pode pular
          KOF_EXIGIR_GL: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Testes de fluxo (Playwright, só no Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @kof/desktop exec playwright install --with-deps chromium
          pnpm e2e
      - name: PS1 nativo de ponta a ponta (app de verdade + PCSX nativo, só no Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p kof-app
          node tools/testar-conexoes.mjs target/debug/kofstation
          node tools/testar-nativo.mjs target/debug/kofstation
          node tools/testar-ps2.mjs target/debug/kofstation
      - name: Atualizador de ponta a ponta (chave de teste, servidor local, núcleos de verdade; só no Linux)
        if: runner.os == 'Linux'
        run: node tools/testar-atualizacao.mjs
      - name: Rede (M13; paridade com o kofservico e o Rede.java do APK do antigo; só no Linux)
        if: runner.os == 'Linux'
        run: |
          git init -q /tmp/kofstation-old && cd /tmp/kofstation-old
          git fetch -q --depth 1 https://github.com/Marcelao98/kofstation-old ceba493fc494165de6f561b77a699fb8c22b295f && git checkout -q FETCH_HEAD
          cd - && node tools/testar-rede.mjs /tmp/kofstation-old
          cargo build -p kof-app && node tools/testar-aparelhos.mjs --antigo /tmp/kofstation-old
      # roda mesmo se um passo de antes falhou (um teste instável não pode deixar o celular sem APK pra testar);
      # por isso busca o kofstation-old sozinho se o passo da rede não chegou a rodar
      - name: Casca do Android (M14; comandos em Java na JVM e o APK montando e assinando; só no Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          if [ ! -d /tmp/kofstation-old/android ]; then
            git init -q /tmp/kofstation-old && git -C /tmp/kofstation-old fetch -q --depth 1 https://github.com/Marcelao98/kofstation-old ceba493fc494165de6f561b77a699fb8c22b295f && git -C /tmp/kofstation-old checkout -q FETCH_HEAD
          fi
          sudo apt-get install -y -q aapt apksigner zipalign libandroid-23-java dalvik-exchange android-sdk-platform-23 libandroid-json-org-java python3-pil
          sh android/testar.sh
          pnpm build
          KOF_APK_ANTIGO=/tmp/kofstation-old/android/apk/KOFstation.apk android/construir-apk.sh target/KOFstation-novo.apk
          aapt dump badging target/KOFstation-novo.apk | grep -E "package: name='dev.kofstation.android'"
          unzip -l target/KOFstation-novo.apk | grep -E "lib/arm64-v8a/libkofps1.so|lib/arm64-v8a/libkofrede.so|assets/web/index.html"
      # o APK de teste fica pra baixar na página desta execução (Actions → a execução → Artifacts), 14 dias: pra testar
      # no celular sem montar no PC (chave de TESTE; nada de jogo dentro)
      - name: Guardar o APK de teste
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: KOFstation-novo-apk
          path: target/KOFstation-novo.apk
          retention-days: 14
          if-no-files-found: error
      - name: Paridade da abertura e do controle de toque no celular (a página do APK antigo × a do novo, mesmos arquivos; só no Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/antigo-pagina && cp /tmp/kofstation-old/publicado/android/KOFnes-android.html /tmp/antigo-pagina/index.html
          ln -s /tmp/kofstation-old/publicado/nucleos /tmp/antigo-pagina/nucleos
          (cd /tmp/antigo-pagina && python3 -m http.server 4190 >/dev/null 2>&1 &)
          (cd apps/desktop && pnpm exec vite preview --host 127.0.0.1 --port 4191 --strictPort >/tmp/preview-4191.log 2>&1 &)
          python3 tools/paridade/arquivos.py /tmp/paridade-arquivos
          for porta in 4190 4191; do
            for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:$porta/ && break; sleep 1; done
            curl -sf -o /dev/null http://127.0.0.1:$porta/ || { echo "servidor da porta $porta não subiu"; cat /tmp/preview-4191.log; exit 1; }
          done
          node tools/paridade-abrir.mjs http://127.0.0.1:4190/index.html "http://127.0.0.1:4191/?celular=1" /tmp/paridade-arquivos
          node tools/paridade-controle.mjs http://127.0.0.1:4190/index.html "http://127.0.0.1:4191/?celular=1" /tmp/paridade-arquivos
